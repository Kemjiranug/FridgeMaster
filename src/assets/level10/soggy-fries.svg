<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Fry gradient -->
    <linearGradient id="fryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <!-- Ketchup sauce gradient -->
    <linearGradient id="sauceRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <!-- Paper tray / box gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="106" rx="40" ry="7" fill="#0000001c"/>

  <!-- Red Paper Box / Container -->
  <path d="M 28 66 L 36 100 L 84 100 L 92 66 Z" fill="url(#boxGrad)" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Front cutout scoop -->
  <path d="M 28 66 Q 60 76 92 66 L 84 100 L 36 100 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>

  <!-- Limp, droopy, bending french fries (มันฝรั่งนิ่ม งอ ย้อย) -->
  <!-- Fry 1 (bent sharply left) -->
  <path d="M 40 70 C 34 50, 24 45, 18 52 C 16 54, 22 58, 26 56 C 30 54, 38 60, 44 72 Z" fill="url(#fryGrad)" stroke="#a16207" stroke-width="1.2"/>
  
  <!-- Fry 2 (drooping down the left side) -->
  <path d="M 48 70 C 42 42, 32 32, 24 38 C 22 42, 30 46, 36 44 C 40 42, 46 58, 52 72 Z" fill="url(#fryGrad)" stroke="#a16207" stroke-width="1.2"/>

  <!-- Fry 3 (bent and curved center-left) -->
  <path d="M 52 70 C 50 35, 42 22, 50 20 C 56 20, 56 30, 58 45 C 60 58, 60 68, 60 72 Z" fill="url(#fryGrad)" stroke="#a16207" stroke-width="1.2"/>

  <!-- Fry 4 (drooping curved center-right) -->
  <path d="M 64 70 C 64 38, 70 24, 78 26 C 84 28, 80 40, 74 50 C 70 60, 68 68, 68 72 Z" fill="url(#fryGrad)" stroke="#a16207" stroke-width="1.2"/>

  <!-- Fry 5 (bent heavily to the right) -->
  <path d="M 72 70 C 74 46, 88 36, 98 42 C 102 46, 94 50, 88 48 C 82 46, 78 60, 76 72 Z" fill="url(#fryGrad)" stroke="#a16207" stroke-width="1.2"/>

  <!-- Fry 6 (limp and hanging over the right edge) -->
  <path d="M 78 72 C 86 56, 98 52, 104 60 C 104 64, 96 66, 92 64 C 88 62, 84 70, 82 76 Z" fill="url(#fryGrad)" stroke="#a16207" stroke-width="1.2"/>

  <!-- SOGGY SAUCE SPLATTERS & DRIZZLES (ซอสราดแฉะเยิ้ม) -->
  <!-- Ketchup puddle over the top of fries -->
  <path d="M 38 48 
           Q 46 36 56 42 
           Q 68 34 78 44 
           Q 84 52 76 60 
           Q 62 66 52 60 
           Q 42 66 34 58 
           Z" 
        fill="url(#sauceRed)" stroke="#7f1d1d" stroke-width="1.2"/>

  <!-- Messy drips of sauce running down between fries -->
  <path d="M 54 44 C 54 58, 52 64, 52 74 C 52 78, 56 78, 56 74 C 56 64, 58 56, 58 44 Z" fill="#dc2626"/>
  <path d="M 70 46 C 70 56, 72 66, 74 76 C 74 80, 78 80, 78 75 C 76 66, 74 56, 74 46 Z" fill="#b91c1c"/>

  <!-- Creamy mayo / cheese sauce zigzag streaks on top of ketchup -->
  <path d="M 36 52 Q 46 44 58 54 Q 70 46 80 56" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 42 62 Q 56 56 70 64" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Shiny gloss highlights on wet sauce -->
  <ellipse cx="50" cy="46" rx="4" ry="2" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="68" cy="48" rx="5" ry="2.2" fill="#ffffff" opacity="0.55"/>

  <!-- Big messy drip rolling down front of the container (เลอะเทอะ) -->
  <path d="M 46 72 C 46 82, 48 88, 48 94 C 48 97, 44 97, 44 93 C 44 87, 42 82, 42 72 Z" fill="#991b1b"/>
  <circle cx="46" cy="95" r="2.5" fill="#7f1d1d"/>
</svg>
