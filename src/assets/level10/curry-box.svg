<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="curryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="40%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="lidGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, -6)">
    <!-- Ground shadow -->
    <ellipse cx="60" cy="104" rx="42" ry="7" fill="#0000001c"/>

    <!-- Box Outer Shell (Food container body) -->
    <rect x="18" y="38" width="84" height="60" rx="10" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="2.5"/>

    <!-- Inside Well (Curry bowl area) -->
    <rect x="23" y="43" width="74" height="49" rx="7" fill="url(#curryGrad)" stroke="#3f6212" stroke-width="1.5"/>

    <!-- Coconut milk swirl -->
    <path d="M 34 58 Q 50 48 68 56 Q 82 64 88 54" fill="none" stroke="#fefce8" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 40 72 Q 58 64 74 74" fill="none" stroke="#fefce8" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Eggplant / Veggie chunks -->
    <circle cx="36" cy="74" r="5" fill="#581c87"/>
    <circle cx="36" cy="74" r="3.2" fill="#7e22ce"/>
    <circle cx="78" cy="70" r="5.5" fill="#581c87"/>
    <circle cx="78" cy="70" r="3.5" fill="#7e22ce"/>

    <!-- Red chili slivers -->
    <path d="M 48 52 Q 54 48 60 52" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <path d="M 64 66 Q 70 60 74 65" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Basil leaves -->
    <path d="M 52 64 C 48 58 56 56 58 62 C 60 68 54 70 52 64 Z" fill="#15803d"/>
    <path d="M 45 60 C 42 56 48 54 50 58 Z" fill="#16a34a"/>

    <!-- Clear Lid Glaze / Sealed Lid Highlight -->
    <rect x="20" y="39" width="80" height="57" rx="8" fill="url(#lidGlass)" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <!-- Diagonal Lid Reflection -->
    <path d="M 32 40 L 52 40 L 26 92 L 20 92 Z" fill="#ffffff" opacity="0.25"/>

    <!-- Container Lip & Snap Clasps -->
    <rect x="15" y="34" width="90" height="8" rx="3.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect x="12" y="37" width="5" height="7" rx="1.5" fill="#64748b"/>
    <rect x="103" y="37" width="5" height="7" rx="1.5" fill="#64748b"/>
  </g>
</svg>
