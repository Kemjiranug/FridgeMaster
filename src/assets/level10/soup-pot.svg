<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Steam gradient -->
    <linearGradient id="soupSteam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="steamBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="108" rx="38" ry="7" fill="#0000001c"/>

  <!-- Left handle -->
  <path d="M 16 68 C 10 68 8 78 18 80 L 24 79" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right handle -->
  <path d="M 104 68 C 110 68 112 78 102 80 L 96 79" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Pot body -->
  <path d="M 22 62 
           C 22 96, 32 104, 60 104 
           C 88 104, 98 96, 98 62 
           Z" 
        fill="url(#potGrad)" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Metal rim -->
  <ellipse cx="60" cy="62" rx="38" ry="11" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="60" cy="62" rx="35" ry="9" fill="url(#soupGrad)"/>

  <!-- Soup surface details: oil droplets, herbs, carrots -->
  <ellipse cx="50" cy="63" rx="4" ry="2" fill="#fdba74" opacity="0.6"/>
  <circle cx="70" cy="62" r="3" fill="#ef4444"/>
  <circle cx="42" cy="61" r="2.5" fill="#22c55e"/>
  <circle cx="60" cy="64" r="2.8" fill="#eab308"/>
  <circle cx="78" cy="63" r="2" fill="#22c55e"/>
  <ellipse cx="55" cy="60" rx="3" ry="1.5" fill="#ffffff" opacity="0.4"/>

  <!-- Pot metallic shine highlight -->
  <path d="M 28 67 C 27 82, 33 96, 44 100 C 37 94, 33 82, 33 67 Z" fill="#ffffff" opacity="0.25"/>

  <!-- Vigorous steam plumes -->
  <g filter="url(#steamBlur)">
    <!-- Steam 1 Left -->
    <path d="M 40 52 C 32 40, 48 30, 36 14 C 32 8, 38 4, 38 4" fill="none" stroke="url(#soupSteam)" stroke-width="6" stroke-linecap="round"/>
    <!-- Steam 2 Center -->
    <path d="M 60 50 C 68 36, 52 24, 62 8 C 64 5, 62 3, 62 3" fill="none" stroke="url(#soupSteam)" stroke-width="7" stroke-linecap="round"/>
    <!-- Steam 3 Right -->
    <path d="M 78 52 C 86 42, 70 30, 80 14 C 84 8, 80 4, 80 4" fill="none" stroke="url(#soupSteam)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
