<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Plastic bag transparency gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#f8fafc" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#f8fafc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="107" rx="34" ry="6" fill="#0000001c"/>

  <!-- Bag Flared Top (above the rubber band) -->
  <path d="M 46 22 
           C 40 10, 36 8, 48 6 
           C 54 8, 66 8, 72 6 
           C 84 8, 80 10, 74 22 
           Z" 
        fill="#f8fafc" opacity="0.8" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Red Rubber Band (มัดหนังยาง) -->
  <ellipse cx="60" cy="23" rx="10" ry="3.5" fill="#dc2626" stroke="#991b1b" stroke-width="1.8"/>
  <ellipse cx="60" cy="26" rx="9.5" ry="3" fill="#ef4444"/>

  <!-- Puffed Bag Main Body -->
  <path d="M 52 25 
           C 30 35, 18 55, 20 84 
           C 22 102, 36 104, 60 104 
           C 84 104, 98 102, 100 84 
           C 102 55, 90 35, 68 25 
           Z" 
        fill="url(#riceGrad)" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round"/>

  <!-- Fried Rice Texture: egg, scallions, carrots, grains -->
  <g opacity="0.9">
    <!-- Scrambled egg pieces -->
    <ellipse cx="40" cy="62" rx="7" ry="4" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="72" cy="74" rx="8" ry="4.5" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="58" cy="88" rx="6" ry="3.5" fill="#ffffff" opacity="0.85"/>

    <!-- Carrot cubes (orange) -->
    <rect x="48" y="52" width="4.5" height="4.5" rx="1" fill="#ea580c"/>
    <rect x="68" y="58" width="5" height="4.5" rx="1" fill="#ea580c"/>
    <rect x="36" y="82" width="5" height="5" rx="1" fill="#ea580c"/>
    <rect x="80" y="84" width="4.5" height="4.5" rx="1" fill="#ea580c"/>
    <rect x="52" y="76" width="4" height="4" rx="1" fill="#ea580c"/>

    <!-- Spring onions / scallions (green) -->
    <circle cx="34" cy="52" r="3" fill="#16a34a"/>
    <circle cx="58" cy="64" r="3.2" fill="#15803d"/>
    <circle cx="78" cy="66" r="3" fill="#16a34a"/>
    <circle cx="46" cy="90" r="3.2" fill="#15803d"/>
    <circle cx="68" cy="92" r="2.8" fill="#16a34a"/>

    <!-- Rice grain specks -->
    <ellipse cx="48" cy="44" rx="2" ry="1.2" fill="#fef9c3"/>
    <ellipse cx="64" cy="46" rx="2" ry="1.2" fill="#fef9c3"/>
    <ellipse cx="38" cy="72" rx="2" ry="1.2" fill="#fef9c3"/>
    <ellipse cx="84" cy="76" rx="2" ry="1.2" fill="#fef9c3"/>
    <ellipse cx="62" cy="80" rx="2" ry="1.2" fill="#fef9c3"/>
  </g>

  <!-- Clear Plastic Crinkles & Highlights -->
  <path d="M 52 25 
           C 30 35, 18 55, 20 84 
           C 22 102, 36 104, 60 104 
           C 84 104, 98 102, 100 84 
           C 102 55, 90 35, 68 25 
           Z" 
        fill="url(#bagGrad)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Left vertical plastic highlight sheen -->
  <path d="M 28 46 C 24 64, 25 84, 32 94 C 28 86, 26 66, 32 46 Z" fill="#ffffff" opacity="0.65"/>
  <!-- Bag pleat lines -->
  <path d="M 56 26 C 50 36, 42 46, 36 54" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.7"/>
  <path d="M 64 26 C 70 36, 78 46, 84 54" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.7"/>
</svg>
