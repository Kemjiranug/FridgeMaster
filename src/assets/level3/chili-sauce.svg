<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="30%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="45%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="50" cy="94" rx="22" ry="4" fill="#0000001c" />

  <!-- Bottle Body + Neck -->
  <path d="M 43 24 
           L 57 24 
           L 57 34 
           C 57 38, 70 42, 70 48 
           L 70 86 
           A 6 6 0 0 1 64 92 
           L 36 92 
           A 6 6 0 0 1 30 86 
           L 30 48 
           C 30 42, 43 38, 43 34 
           Z" 
        fill="url(#sauceGrad)" 
        stroke="#7f1d1d" 
        stroke-width="1.5" 
        stroke-linejoin="round" />

  <!-- Left Glass Gloss Highlight -->
  <path d="M 33.5 49 
           L 33.5 85 
           C 33.5 88, 36 89, 38 89 
           C 36 88.5, 35.5 86.5, 35.5 84 
           L 35.5 50 
           C 35.5 44, 41 39, 43 35 
           C 39 39, 33.5 43.5, 33.5 49 Z" 
        fill="#ffffff" 
        opacity="0.4" />

  <!-- Front Label -->
  <rect x="35" y="51" width="30" height="28" rx="4" fill="url(#labelGrad)" stroke="#d97706" stroke-width="1" />
  <rect x="36.5" y="52.5" width="27" height="25" rx="3" fill="none" stroke="#dc2626" stroke-width="0.7" stroke-dasharray="2 1" />

  <!-- Red chili graphic on label -->
  <path d="M 45 66 
           C 42 63, 44 57, 52 56 
           C 53.5 60.5, 50 66, 45 66 Z" 
        fill="#dc2626" />
  <!-- Green stem -->
  <path d="M 52 56 
           C 53.5 54, 55.5 54.5, 56 54 
           C 55 55.5, 53.5 56.5, 52 57 Z" 
        fill="#15803d" />
  <circle cx="52" cy="56" r="1.2" fill="#16a34a" />

  <!-- Label text "CHILI SAUCE" -->
  <text x="50" y="71" font-family="system-ui, -apple-system, sans-serif" font-size="4.8" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="0.3">CHILI</text>
  <text x="50" y="75.5" font-family="system-ui, -apple-system, sans-serif" font-size="3.4" font-weight="800" fill="#b45309" text-anchor="middle" letter-spacing="0.4">SAUCE</text>

  <!-- Green Squeeze Cap Collar -->
  <rect x="42" y="20" width="16" height="5.5" rx="1.5" fill="url(#capGrad)" stroke="#14532d" stroke-width="1" />
  <line x1="43.5" y1="22.8" x2="56.5" y2="22.8" stroke="#14532d" stroke-width="0.8" opacity="0.5" />

  <!-- Tapered Nozzle -->
  <path d="M 46 20 
           L 48 7 
           C 48 5.5, 52 5.5, 52 7 
           L 54 20 
           Z" 
        fill="url(#capGrad)" 
        stroke="#14532d" 
        stroke-width="1" 
        stroke-linejoin="round" />
  <!-- Tip hole -->
  <ellipse cx="50" cy="7" rx="2" ry="0.9" fill="#14532d" />
</svg>
