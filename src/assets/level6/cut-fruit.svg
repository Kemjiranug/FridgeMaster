<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="melonFlesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="pineappleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cantaloupeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="kiwiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="70%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="106" rx="46" ry="7" fill="#00000018"/>

  <!-- Serving Plate -->
  <ellipse cx="60" cy="88" rx="48" ry="17" fill="url(#plateGrad)" stroke="#94a3b8" stroke-width="2.2"/>
  <ellipse cx="60" cy="86" rx="41" ry="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 1. Cantaloupe / Orange Melon slice (back left) -->
  <g transform="translate(24, 48) rotate(-20)">
    <path d="M 0 32 A 32 32 0 0 1 42 6 L 42 16 A 22 22 0 0 0 10 32 Z" fill="#84cc16" stroke="#4d7c0f" stroke-width="1.2"/>
    <path d="M 5 30 A 28 28 0 0 1 40 10 L 40 16 A 22 22 0 0 0 10 30 Z" fill="url(#cantaloupeGrad)"/>
  </g>

  <!-- 2. Pineapple chunks (center-back) -->
  <g transform="translate(68, 42) rotate(15)">
    <!-- Pineapple wedge 1 -->
    <path d="M 0 0 L 22 4 L 26 24 L 6 22 Z" fill="url(#pineappleGrad)" stroke="#a16207" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="12" cy="11" r="2.5" fill="#ca8a04"/>
    <line x1="6" y1="6" x2="18" y2="16" stroke="#ca8a04" stroke-width="1.2"/>
    <line x1="18" y1="6" x2="6" y2="16" stroke="#ca8a04" stroke-width="1.2"/>
  </g>

  <!-- 3. Fresh Cut Watermelon Slices (front center/left) -->
  <g transform="translate(22, 54)">
    <!-- Watermelon rind (green) -->
    <path d="M 4 36 Q 28 46 54 36" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <path d="M 5 35 Q 28 44 53 35" fill="none" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round"/>
    <!-- Watermelon red flesh -->
    <path d="M 6 34 Q 28 43 52 34 L 29 2 Z" fill="url(#melonFlesh)" stroke="#b91c1c" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Watermelon seeds -->
    <ellipse cx="22" cy="24" rx="1.5" ry="2.2" fill="#1e293b" transform="rotate(-15 22 24)"/>
    <ellipse cx="36" cy="24" rx="1.5" ry="2.2" fill="#1e293b" transform="rotate(15 36 24)"/>
    <ellipse cx="29" cy="16" rx="1.5" ry="2.2" fill="#1e293b"/>
    <ellipse cx="29" cy="30" rx="1.5" ry="2.2" fill="#1e293b"/>
  </g>

  <!-- 4. Cut Kiwi Slices (front right) -->
  <g transform="translate(62, 60)">
    <!-- Kiwi skin -->
    <circle cx="20" cy="20" r="17" fill="#78350f"/>
    <!-- Kiwi green flesh -->
    <circle cx="20" cy="20" r="15" fill="url(#kiwiGrad)" stroke="#3f6212" stroke-width="1"/>
    <!-- Kiwi pale core -->
    <ellipse cx="20" cy="20" rx="5" ry="6" fill="#ecfccb"/>
    <!-- Kiwi seeds ring -->
    <circle cx="14" cy="16" r="1" fill="#1e293b"/>
    <circle cx="14" cy="24" r="1" fill="#1e293b"/>
    <circle cx="26" cy="16" r="1" fill="#1e293b"/>
    <circle cx="26" cy="24" r="1" fill="#1e293b"/>
    <circle cx="20" cy="13" r="1" fill="#1e293b"/>
    <circle cx="20" cy="27" r="1" fill="#1e293b"/>
  </g>

  <!-- 5. Fresh Cut Apple Wedge (far right) -->
  <g transform="translate(86, 68) rotate(25)">
    <!-- Red skin -->
    <path d="M 0 0 C 4 12, 14 18, 20 18" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <!-- Pale yellow flesh -->
    <path d="M 0 0 C 4 12, 14 18, 20 18 L 10 6 Z" fill="#fef9c3" stroke="#facc15" stroke-width="0.8"/>
  </g>
</svg>
